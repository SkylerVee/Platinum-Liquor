<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platinum Liquors - Login</title>
    <!-- External CSS Style Sheet Link -->
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Core Global Library Dependency CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
</head>
<body class="login-page-body">

    <!-- STICKY PLATINUM PLATFORM HEADER -->
    <header class="platinum-sticky-header">
         <div class="brand-logo">
            <svg class="liquor-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 2h6v3H9z" />
                <path d="M7 9v11a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a4 4 0 0 0-4-4h-2a4 4 0 0 0-4 4z" />
                <path d="M7 13h10" />
                <path d="M19 11l1 7a2 2 0 0 1-2 2h-1" />
            </svg>
            <span>PLATINUM LIQUORS</span>
        </div>
        <nav class="header-nav-links">
            <a href="home.html">Home</a>
            <a href="catalog.html">Catalog</a>
            <a href="checkout.html">Checkout</a>
        </nav>
    </header>

    <!-- CORE TRANSACTION AUTH CONTAINER CARD -->
    <div class="auth-container-card">
        <div class="toggle-tab-group">
            <button id="tab-login" class="tab-btn active" onclick="switchAuthView('login')">Returning Customer</button>
            <button id="tab-register" class="tab-btn" onclick="switchAuthView('register')">New Customer</button>
        </div>

        <!-- RETURNING CUSTOMER LOG IN BLOCK -->
        <form id="form-login-block" onsubmit="executeCustomerLogin(event)">
            <div class="form-row">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" name="username" autocomplete="email" required placeholder="name@domain.com">
            </div>
            <div class="form-row">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" autocomplete="current-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="action-submit-btn">ACCESS PLATFORM</button>
        </form>

        <!-- FIRST TIME ACCOUNT REGISTRATION BLOCK -->
        <form id="form-register-block" class="hidden-panel" onsubmit="executeCustomerRegistration(event)">
            <div class="form-row">
                <label for="reg-name">Your Name</label>
                <input type="text" id="reg-name" required placeholder="John Doe">
            </div>
            <div class="form-row">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" name="username" autocomplete="email" required placeholder="yourname@email.com">
            </div>
            <div class="form-row">
                <label for="reg-password">Create New Password</label>
                <input type="password" id="reg-password" name="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 letters & numbers mixed">
            </div>
            <div class="form-row">
                <label for="reg-confirm-password">Confirm Password</label>
                <input type="password" id="reg-confirm-password" required placeholder="Re-enter password">
                <small class="field-hint-text">Must be at least 6 characters long and include a mix of words and numbers.</small>
            </div>
            <button type="submit" class="action-submit-btn">REGISTER ACCOUNT</button>
        </form>
    </div>

    <!-- Shared Supabase client bootstrap -->
    <script src="supabase-client.js"></script>
    <script src="login.js"></script>

</body>
</html>
